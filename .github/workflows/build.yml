name: Build Mihomo Rule Sets

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'rules/**'
      - '.github/workflows/build.yml'

# Avoid concurrent builds racing to force-push different snapshots to release.
concurrency:
  group: mihomo-rules-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Download mihomo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          release_json=$(mktemp)
          archive=$(mktemp)
          binary=$(mktemp)
          trap 'rm -f "$release_json" "$archive" "$binary"' EXIT

          # Read the latest release and its asset URL from GitHub's API instead
          # of constructing a URL from an assumed filename pattern.
          curl --fail --silent --show-error --location --retry 5 --retry-all-errors -H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${GH_TOKEN}" -H "X-GitHub-Api-Version: 2022-11-28" https://api.github.com/repos/MetaCubeX/mihomo/releases/latest -o "$release_json"

          asset_url=$(jq -er '
            . as $release
            | .assets[]
            | select(.name == ("mihomo-linux-amd64-compatible-" + $release.tag_name + ".gz"))
            | .browser_download_url
          ' "$release_json") || {
            echo "::error::Latest Mihomo release has no linux-amd64-compatible gzip asset"
            jq -r '"Latest release tag: " + (.tag_name // "missing")' "$release_json"
            exit 1
          }
          echo "Downloading Mihomo asset: $asset_url"

          curl --fail --silent --show-error --location --retry 5 --retry-all-errors --output "$archive" "$asset_url"
          gzip --test "$archive" || {
            echo "::error::Downloaded Mihomo asset is not a valid gzip archive"
            exit 1
          }
          gunzip --stdout "$archive" > "$binary"
          test -s "$binary" || {
            echo "::error::Downloaded Mihomo binary is empty"
            exit 1
          }
          install -m 0755 "$binary" /usr/local/bin/mihomo
          mihomo -v

      - name: Convert .list to .mrs
        run: |
          mkdir -p release/rules/domain release/rules/ip
          
          # 转换 domain 规则
          for file in rules/domain/*.list; do
            [ -f "$file" ] || continue
            name=$(basename "$file" .list)
            # 去掉注释和空行，生成干净的临时文件
            grep -v '^#' "$file" | grep -v '^$' > "/tmp/${name}.txt"
            # 转换为 MRS
            mihomo convert-ruleset domain text "/tmp/${name}.txt" "release/rules/domain/${name}.mrs"
            echo "✓ MRS: rules/domain/${name}.mrs ($(wc -l < "/tmp/${name}.txt") rules)"
            # 复制原始 .list 文件
            cp "$file" "release/rules/domain/${name}.list"
            echo "✓ LIST: rules/domain/${name}.list"
          done
          
          # 转换 ip 规则
          for file in rules/ip/*.list; do
            [ -f "$file" ] || continue
            name=$(basename "$file" .list)
            grep -v '^#' "$file" | grep -v '^$' > "/tmp/${name}.txt"
            mihomo convert-ruleset ipcidr text "/tmp/${name}.txt" "release/rules/ip/${name}.mrs"
            echo "✓ MRS: rules/ip/${name}.mrs ($(wc -l < "/tmp/${name}.txt") rules)"
            cp "$file" "release/rules/ip/${name}.list"
            echo "✓ LIST: rules/ip/${name}.list"
          done

      - name: Verify MRS files
        run: |
          echo "=== MRS files ==="
          find release -name "*.mrs" -exec ls -la {} \;
          echo ""
          echo "=== LIST files ==="
          find release -name "*.list" -exec ls -la {} \;

      - name: Push to release branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd release
          git init
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b release
          git add .
          git commit -m "Release $(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M')"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
          git push -f -u origin release
          echo "✅ Published to release branch"

      - name: Purge jsDelivr cache
        run: |
          set -euo pipefail
          for type in domain ip; do
            for ext in mrs list; do
              for file in "release/rules/${type}"/*."${ext}"; do
                [ -f "$file" ] || continue
                name=$(basename "$file")
                url="https://purge.jsdelivr.net/gh/${{ github.repository }}@release/rules/${type}/${name}"
                if ! curl --fail --silent --show-error --location --retry 3 --retry-all-errors "$url"; then
                  echo "::warning::Failed to purge jsDelivr cache for rules/${type}/${name}"
                fi
              done
            done
          done
